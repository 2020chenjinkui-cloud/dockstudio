ignore = [
    # 桌面单机应用：时间戳一律用本地朴素时间（datetime.now()），
    # 事件审计场景下 ISO 时间由 events.py 显式 UTC 化处理。
    "DTZ005",
    "EXE002",
    # ── 异常捕获债务：本轮显式不进门禁，改为逐条登记（不用 # noqa 埋） ──────
    # BLE001(133) / S110(37) / S112(5) 在 2.0.5 基线共 175 处，绝大多数落在
    # "科学计算降级"路径上：GPU / 对接引擎 / 可选插件不可用时回退到 CPU 或内置
    # 几何算法，这种兜底本身就是产品行为的一部分。把它们机械收窄成具体异常类型
    # 会改变降级行为；而"某个调用点到底该不该降级、降级后要不要在报告里留痕"
    # 必须逐个按科学语义判断 —— 那正是第 2 轮"统一降级台账"的范围。
    # 本轮处置：不 select 这三条（于是也不存在靠批量 # noqa 让门禁变绿的动机），
    # 175 处全部登记在 docs/qa/exception-debt.md（文件:行 + 模块 + 是否在科学结论
    # 路径 + 第 2 轮建议）。原先带 # noqa: BLE001 的 32 处已改写为 "# 降级兜底"
    # 注释标记，第 2 轮可直接 grep 定位：grep -rn 降级兜底 server/dockstudio
    "BLE001",
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# frozen groundwork file, kept verbatim per project constraint
"dockstudio/config.py" = ["UP037"]
# 包入口是刻意的导入顺序工程（ABI 冲突防护），sort 规则不适用
"dockstudio/__init__.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
