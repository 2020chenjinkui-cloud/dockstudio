[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockstudio"
version = "2.0.5"
description = "Cross-platform molecular docking platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # 科学复现：计算核心依赖上界锁定。ETKDG 构象生成结果随 rdkit 版本漂移
    # （2026.03→2026.9 实测导致 vina 姿态聚类数变化），新版本需金标准回归验证后再放开
    "rdkit>=2024.3,<2026.4",
    "meeko>=0.5,<0.9",
    "scipy>=1.11",
    "gemmi>=0.6",
    "openbabel>=3.2.0,<4",  # 官方轮子（不要 openbabel-wheel：同名包共存会导致插件路径Frankestein混乱）
    "python-multipart>=0.0.9",  # FastAPI form/file uploads
    "plip>=3.0",  # protein-ligand interaction profiling (builtin geometric fallback kept)
    "posebusters>=0.4",  # pose quality checks (builtin geometric fallback kept)
    "matplotlib>=3.8",  # 2D diagram support
    "prolif>=2.0",  # interaction fingerprints (optional; unused at runtime)
    "rich>=13.0",  # terminal UI and TrueColor formatting (Claude Code design system)
    "prompt-toolkit>=3.0",  # interactive terminal REPL and prompt input
]

[project.optional-dependencies]
dev = [
    # 不依赖 PyPI vina 包：引擎一律走官方二进制子进程（resources/bin），
    # PyPI 轮子缺 Windows 与 macOS-arm64，装上反而破坏 CI。
    "pytest>=8.0",
    "httpx>=0.27",
    # 静态检查必须精确锁定：ruff 的默认规则集会随版本漂移（实测 0.15.0=29 errors，
    # 0.16.0 起=226 errors），区间约束会让"同一份代码"在干净环境里由绿转红。
    # 升级 ruff 前须先同步 [tool.ruff.lint].select 清单并在 ubuntu-p4 runner 上复跑门禁。
    "ruff==0.16.10",
    "mypy>=1.9",
]

[project.scripts]
dockstudio-server = "dockstudio.api.app:main"
dockstudio = "dockstudio.cli:main"

[tool.setuptools.packages.find]
include = ["dockstudio*"]

[tool.setuptools.package-data]
dockstudio = ["demo_data/*.pdb", "demo_data/*.smi", "demo_data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ── 规则集策略：显式冻结，不跟随 ruff 的默认规则集 ───────────────────────────
# 事实：ruff 0.16.0 把默认"稳定规则集"从 29 条扩到 400+ 条，同一份代码实测
#   0.4.10 / 0.12.11 / 0.15.0 → 29 errors
#   0.16.0 / 0.16.10        → 226 errors
# 即 CI 的 `ruff check server/dockstudio` 在"只把 ruff 装新版"的情况下就会由绿转红。
# 因此这里把规则集钉成显式清单，dev extra 里把 ruff 锁成精确版本 ==0.16.10，
# 使 lint 门禁的结果只取决于这份清单，不取决于安装了什么版本的 ruff。
#
# 清单来源：ruff 0.16.10 默认启用规则 411 条（`--show-settings` 实测）剔除
# BLE001/S110/S112（理由见下方 ignore 段）后的 408 条。它记录的是"当前实际在守的门"，
# 不是理想集：只允许按评审逐条增加，不要整体删除或改成 ["ALL"]。
# 核对/重新生成：
#   ruff check server/dockstudio --show-settings | sed -n '/linter.rules.enabled/,/^]/p'
