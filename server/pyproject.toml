[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dockstudio"
version = "0.1.0"
description = "Cross-platform molecular docking platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "rdkit>=2024.3",
    "meeko>=0.5",
    "scipy>=1.11",
    "gemmi>=0.6",
    "openbabel>=3.2.0,<4",  # 官方轮子（不要 openbabel-wheel：同名包共存会导致插件路径Frankestein混乱）
    "python-multipart>=0.0.9",  # FastAPI form/file uploads
    "plip>=3.0",  # protein-ligand interaction profiling (builtin geometric fallback kept)
    "posebusters>=0.4",  # pose quality checks (builtin geometric fallback kept)
    "matplotlib>=3.8",  # 2D diagram support
    "prolif>=2.0",  # interaction fingerprints (optional; unused at runtime)
]

[project.optional-dependencies]
dev = [
    # 不依赖 PyPI vina 包：引擎一律走官方二进制子进程（resources/bin），
    # PyPI 轮子缺 Windows 与 macOS-arm64，装上反而破坏 CI。
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
dockstudio-server = "dockstudio.api.app:main"
dockstudio = "dockstudio.cli:main"

[tool.setuptools.packages.find]
include = ["dockstudio*"]

[tool.setuptools.package-data]
dockstudio = ["demo_data/*.pdb", "demo_data/*.smi", "demo_data/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# frozen groundwork file, kept verbatim per project constraint
"dockstudio/config.py" = ["UP037"]
# 包入口是刻意的导入顺序工程（ABI 冲突防护），sort/try-except 规则不适用
"dockstudio/__init__.py" = ["I001", "S110", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
