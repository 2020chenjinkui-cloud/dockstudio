name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tagName:
        description: "要发布到的 tag（留空则用当前 ref）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Linux 安装包走自托管 runner（ubuntu-p4）：不消耗账户 Actions 分钟
  linux-installers:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: workspaces -> apps/desktop/src-tauri
      - name: Linux WebKitGTK 依赖
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - run: bash scripts/fetch_engines.sh
      - run: pip install -e "server[dev]" pyinstaller
      - run: pyinstaller scripts/backend_onefile.spec --noconfirm --clean
      - name: Rename sidecar per target triple
        run: bash scripts/stage_sidecar.sh
      - run: cd apps/web && npm ci && npm run build
      - run: cd apps/desktop && npm ci
      - name: Tauri Build + 上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tagName || github.ref_name }}
          releaseName: "DockStudio ${{ inputs.tagName || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          releaseBody: |
            DockStudio 2.0：跨平台（Windows / macOS / Linux）分子对接平台，简易五步向导 + 高级批量筛选双模式。

            **核心能力**
            - AutoDock Vina 一键内置；smina 引擎；gnina / Uni-Dock GPU 引擎（Linux + NVIDIA）可插拔
            - 五步向导 + 内置一键示例（PDB:1HSG）：受体/配体准备、口袋预测、对接、结果分析
            - 批量虚拟筛选（队列/取消/排行/CSV）、柔性残基、等效命令行复现
            - PLIP 相互作用 / 2D 示意图 / PoseBusters 质检 / 共晶 RMSD 对照 / 截图导出
            - Boltz-2 AI 亲和性复核（需自备 boltz 安装）

            **2.0 新增：可溯源与用户体验**
            - 全程溯源：事件流 JSONL、audit.zip 审计包、`dockstudio audit` CLI、rdkit/meeko/openbabel 版本环境指纹、输入文件 SHA256
            - 一键示例项目、后端启动等待页、截图与共晶参考、首屏包体 835KB→96KB
            - 输入规范指引卡（RCSB/PubChem/ZINC 来源向导）+ SMILES 即查 + 演示分子库（10 个真实药物）
            - 中英双语界面、依赖上界锁定（rdkit<2026.4）保证跨环境可复现

            **自检**：后端 112 测试 + 前端 97 测试 + 10 靶点金标准回归；安装包在 Windows NSIS（静默安装实测）/ Linux DEB 与 AppImage（真机实测）通过。

  # Windows / macOS 仍需 GitHub-hosted runner（依赖账户 Actions 额度）
  desktop-installers:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          cache: workspaces -> apps/desktop/src-tauri
      - run: bash scripts/fetch_engines.sh
      - run: pip install -e "server[dev]" pyinstaller
      - run: pyinstaller scripts/backend_onefile.spec --noconfirm --clean
      - name: Rename sidecar per target triple
        run: bash scripts/stage_sidecar.sh
      - run: cd apps/web && npm ci && npm run build
      - run: cd apps/desktop && npm ci
      - name: Tauri Build + 上传 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.tagName || github.ref_name }}
          releaseName: "DockStudio ${{ inputs.tagName || github.ref_name }}"
          releaseDraft: false
          prerelease: false
